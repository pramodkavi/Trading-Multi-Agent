# Continuous deployment to the dev account (Slice 1 Step 1.21).
#
# Triggered when the CI workflow completes successfully on main (workflow_run is
# the faithful "after CI passes" trigger). Deploys all stacks to the dev account.
#
# Why no docker / ECR step: ComputeStack and MonitoringStack package the Lambdas
# as a zip code asset + a dependency layer built by infrastructure/lambda_assets.py
# with pip's manylinux flags, so `cdk deploy` needs only python + pip (no Docker).
#
# DB schema migration runs automatically BEFORE `cdk deploy` (Slice 2): the
# schema is additive + idempotent and must exist before the new Lambda code
# (which INSERTs the new columns) goes live. The cluster/secret ARNs are
# discovered from the DataStack's CloudFormation outputs, so there is nothing
# to configure per environment. See docs/PROJECT_STATE.md §4.
#
# Auth is keyless via GitHub OIDC -> an AWS IAM role (no long-lived keys).
#
# One-time prerequisites (configured outside this repo):
#   - `cdk bootstrap` the dev environment, trusting the deploy role.
#   - GitHub repo secret  AWS_DEPLOY_ROLE_ARN  = the dev OIDC deploy role ARN.
#   - GitHub repo variable AWS_REGION          = e.g. us-east-1.
#   - GitHub Environment "dev".

name: Deploy (dev)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual run from the Actions UI. The operator's machine has NO AWS CLI / CDK /
  # credentials by rule, so every AWS operation -- including the one-off
  # destroy+recreate below -- is a workflow step triggered from GitHub.
  workflow_dispatch:
    inputs:
      recreate_stateless_stacks:
        description: >-
          DESTROY and recreate CryptoSignals-Monitoring, -Scheduling and -Compute
          before deploying (Data/Network untouched). Needed once for the
          2026-10-03 image->zip repackage: CloudFormation cannot replace the
          function while its ARN is an export still imported by the other two
          stacks. Loses the two Lambda log groups (2-week retention).
        type: boolean
        default: false
        required: false

# Never run two dev deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    name: cdk deploy (dev)
    # Auto path: only deploy if the CI run actually succeeded. Manual path: always.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          # Auto path: deploy exactly the commit CI validated, not the branch tip.
          # Manual path (workflow_dispatch): the ref the operator chose in the UI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CDK app dependencies
        run: pip install -r infrastructure/requirements.txt

      - name: Install the migration runner (project package)
        # scripts/migrate.py imports the project; -e gives it psycopg + boto3
        # (both base deps) and the runtime src package. Pip cache makes repeats fast.
        run: pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the CDK CLI
        run: npm install -g aws-cdk@2.1126.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply DB schema migration (Data API, before deploy)
        env:
          DATA_STACK: CryptoSignals-Data
        run: |
          set -euo pipefail
          # First-ever deploy: the cluster doesn't exist yet. Skip — `cdk deploy`
          # creates it, and the schema applies on the next deploy.
          if ! aws cloudformation describe-stacks --stack-name "$DATA_STACK" >/dev/null 2>&1; then
            echo "::notice::$DATA_STACK not found — skipping pre-deploy migration (first deploy?)."
            exit 0
          fi
          q() { aws cloudformation describe-stacks --stack-name "$DATA_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text; }
          CLUSTER_ARN=$(q ClusterArn)
          SECRET_ARN=$(q DbSecretArn)
          DB_NAME=$(q DatabaseName)
          if [ -z "$CLUSTER_ARN" ] || [ "$CLUSTER_ARN" = "None" ] || [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" = "None" ]; then
            echo "::error::Could not resolve ClusterArn/DbSecretArn from $DATA_STACK outputs."
            exit 1
          fi
          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then DB_NAME=signals; fi
          echo "Applying schema to $CLUSTER_ARN (db=$DB_NAME)"
          # Retry to ride out Aurora Serverless v2 scale-to-zero: the first Data
          # API call after idle throws DatabaseResumingException while it wakes.
          for attempt in 1 2 3 4 5; do
            if python -m scripts.migrate --backend dataapi \
                 --cluster-arn "$CLUSTER_ARN" --secret-arn "$SECRET_ARN" --db-name "$DB_NAME"; then
              echo "Migration applied."
              exit 0
            fi
            echo "::warning::Migration attempt $attempt failed (Aurora resuming?); retrying in 20s."
            sleep 20
          done
          echo "::error::Migration failed after 5 attempts."
          exit 1

      - name: Recreate stateless stacks (manual cutover only)
        # Runs ONLY when the operator ticked the box on a manual run. Destroys the
        # three stateless stacks so the next step can create the zip-packaged
        # functions with fresh ARNs/exports. CDK orders the destroys dependents-
        # first (Monitoring, Scheduling import Compute's function ARN). Aurora,
        # S3, the DB secret (Data) and the VPC (Network) are not touched.
        if: github.event_name == 'workflow_dispatch' && inputs.recreate_stateless_stacks == true
        working-directory: infrastructure
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          set -euo pipefail
          echo "::warning::Destroying CryptoSignals-Monitoring, CryptoSignals-Scheduling, CryptoSignals-Compute (Data/Network untouched)."
          cdk destroy CryptoSignals-Monitoring CryptoSignals-Scheduling CryptoSignals-Compute --force
          echo "::notice::Stateless stacks destroyed; recreating with cdk deploy --all."

      - name: Deploy all stacks
        # The Step 2.12 "Compute-first" export transition is complete: the
        # 2026-10-03 zip repackage cutover recreates Compute/Scheduling/Monitoring,
        # so there are no stale cross-stack exports left to release.
        working-directory: infrastructure
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: cdk deploy --all --require-approval never
