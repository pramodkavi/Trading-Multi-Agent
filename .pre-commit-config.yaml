repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Keep this rev equal to the ruff pin in pyproject.toml [dev]. A skew between
  # the two made ruff-format reformat tests/unit/test_migrate.py on every commit
  # and fail CI (the hook is what CI runs; the venv ruff is what developers run).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.4
          - anthropic>=0.39
          - aiohttp>=3.10
          - langgraph>=1.0
          - psycopg[binary]>=3.2
          - asyncpg>=0.29
          - boto3>=1.35
          - fastapi>=0.115
          - mangum>=0.19
        args: [--strict, --config-file=pyproject.toml]
        files: ^src/
